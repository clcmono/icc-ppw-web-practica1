<div class="flex justify-center items-center min-h-screen bg-base-200">
  <form
    [formGroup]="myForm"
    (ngSubmit)="onSubmit()"
    class="bg-base-100 p-8 rounded-2xl shadow-xl w-full max-w-md"
  >
    <h2 class="text-center text-2xl font-semibold mb-6">Formulario</h2>

    <!-- Nombre -->
    <div class="mb-4">
      <label class="block mb-1 font-medium">Nombre</label>
      <input
        formControlName="nombre"
        class="input input-bordered w-full rounded-xl"
        placeholder="Ingrese su nombre"
      />
      @if(formUtils.isValidField(myForm, 'nombre')){
        <p class="text-error text-sm mt-1">
          {{ formUtils.getFieldError(myForm, 'nombre') }}
        </p>
      }
    </div>

    <!-- Correo -->
    <div class="mb-4">
      <label class="block mb-1 font-medium">Correo</label>
      <input
        formControlName="correo"
        class="input input-bordered w-full rounded-xl"
        placeholder="example@mail.com"
      />
      @if(formUtils.isValidField(myForm, 'correo')){
        <p class="text-error text-sm mt-1">
          {{ formUtils.getFieldError(myForm, 'correo') }}
        </p>
      }
    </div>

    <!-- Botón -->
    <button class="btn btn-primary w-full rounded-xl mt-4" type="submit">
      Guardar
    </button>
  </form>
</div>
