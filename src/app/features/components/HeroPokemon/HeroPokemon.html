<header class="hero bg-gradient-to-br from-pink-500 via-pink-400 to-pink-100 text-white rounded-lg shadow-xl mb-8 p-10 flex justify-center items-center backdrop-blur-md bg-opacity-50 border border-pink-200">
  <div class="max-w-xl w-full text-center">
    <h1 class="text-4xl md:text-5xl font-extrabold mb-4 drop-shadow-lg">Pokémon</h1>
    <p class="py-4 text-lg opacity-90 flex items-center justify-center gap-3 drop-shadow">
      <i class="fas fa-music text-pink-600 text-2xl"></i>
      <span>Pokemon go</span>
      <i class="fas fa-music text-pink-600 text-2xl"></i>
    </p>

    <div class="stats stats-horizontal bg-white bg-opacity-80 text-gray-800 shadow-2xl mt-6 w-full backdrop-blur-sm rounded-lg">
      
      <article class="stat p-4">
        <div class="stat-title text-xs font-bold text-gray-950 uppercase">Pokemons</div>
        <div class="stat-value text-3xl font-extrabold text-pink-500">{{ pokemoncount() }}</div>
        <div class="stat-desc text-gray-600">Total de registros</div>
      </article>
      
      <article class="stat p-4">
        <div class="stat-title text-xs font-bold text-gray-950 uppercase">Paginas</div>
        <div class="stat-value text-3xl font-extrabold text-pink-400">
          {{ currentPage() }} / {{ totalPages() }}
        </div>
        <div class="stat-desc text-gray-600">Total disponibles</div>
      </article>
      
    </div>
  </div>
</header>
